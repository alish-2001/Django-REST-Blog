version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_rest_blog_app
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media

  db:
    image: postgres:16
    container_name: django_rest_blog_postgres_db
    env_file:
      - .env.production
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:1.28.0-alpine3.21
    container_name: django_rest_blog_nginx_server
    restart: always
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro


  volumes:
    postgres_data:
    static_volume:
    media_volume: